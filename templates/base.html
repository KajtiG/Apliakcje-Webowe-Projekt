<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kino{% endblock %} · Kino</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('index') }}">🎬 Kino</a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('my_reservations') }}">Moje rezerwacje</a>
        <span class="who">{{ g.user.username }}</span>
        <a href="{{ url_for('logout') }}">Wyloguj</a>
      {% else %}
        <a href="{{ url_for('login') }}">Zaloguj</a>
        <a href="{{ url_for('register') }}">Rejestracja</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
