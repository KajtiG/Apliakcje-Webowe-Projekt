{% extends "base.html" %}
{% block title %}Resetowanie hasła{% endblock %}
{% block content %}
<h1>Resetowanie hasła</h1>
<p>Podaj adres e-mail powiązany z kontem, a wyślemy Ci link do zmiany hasła.</p>
<form method="post" class="auth">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Wyślij link</button>
</form>
<p class="meta"><a href="{% url 'login' %}">Wróć do logowania</a></p>
{% endblock %}
